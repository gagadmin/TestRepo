name: Sync Laravel routes to Postman

on:
  push:
    paths:
      - "routes/*.php"
      - ".github/workflows/sync-postman-collection.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Base URL to place in the Postman collection
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: postman-route-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Add missing Laravel routes
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, pdo_sqlite
          coverage: none
          tools: composer:v2

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare Laravel environment
        shell: bash
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Export authoritative route contract
        shell: bash
        run: |
          php artisan route:list --json > laravel-routes.json

          python - <<'PY'
          import json

          with open("laravel-routes.json", encoding="utf-8") as source:
              routes = json.load(source)

          selected = {}
          for route in routes:
              path = route["uri"]
              if not (
                  path.startswith("api/")
                  or path in {"auth/login", "auth/logout"}
              ):
                  continue

              method = route["method"].split("|", 1)[0].upper()
              selected[(method, path)] = {
                  "method": method,
                  "path": path,
                  "name": route.get("name") or "",
              }

          contract = [
              selected[key]
              for key in sorted(selected, key=lambda value: (value[1], value[0]))
          ]
          if not contract:
              raise SystemExit("No application routes were detected.")

          with open("postman-routes.json", "w", encoding="utf-8") as target:
              json.dump(contract, target, indent=2)

          print(f"Detected {len(contract)} session-authenticated application routes.")
          PY

      - name: Select collection base URL
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_TARGET: ${{ inputs.target }}
          REF_NAME: ${{ github.ref_name }}
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            target="${MANUAL_TARGET}"
          elif [[ "${REF_NAME}" == "main" || "${REF_NAME}" == "master" ]]; then
            target="production"
          else
            target="staging"
          fi

          if [[ "${target}" == "production" ]]; then
            base_url="${PROD_API_BASE_URL}"
          else
            base_url="${STAGING_API_BASE_URL}"
          fi

          if [[ -z "${base_url}" ]]; then
            echo "::error::The ${target} API base URL secret is not configured."
            exit 1
          fi

          echo "target=${target}" >> "${GITHUB_OUTPUT}"

      - name: Download current Postman collection
        shell: bash
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_COLLECTION_ID: ${{ secrets.POSTMAN_COLLECTION_ID }}
        run: |
          if [[ -z "${POSTMAN_API_KEY}" || -z "${POSTMAN_COLLECTION_ID}" ]]; then
            echo "::error::POSTMAN_API_KEY and POSTMAN_COLLECTION_ID are required."
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --header "X-Api-Key: ${POSTMAN_API_KEY}" \
            "https://api.getpostman.com/collections/${POSTMAN_COLLECTION_ID}" \
            > postman-response.json

          python - <<'PY'
          import json

          with open("postman-response.json", encoding="utf-8") as source:
              response = json.load(source)

          collection = response.get("collection")
          if not isinstance(collection, dict) or not collection.get("info"):
              raise SystemExit("Postman returned an invalid collection response.")
          if not isinstance(collection.get("item"), list):
              raise SystemExit("The Postman collection has no item array.")

          with open("postman-collection.json", "w", encoding="utf-8") as target:
              json.dump(collection, target, indent=2)
          PY

      - name: Merge missing routes
        id: merge
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.target }}
          PROD_API_BASE_URL: ${{ secrets.PROD_API_BASE_URL }}
          STAGING_API_BASE_URL: ${{ secrets.STAGING_API_BASE_URL }}
        run: |
          if [[ "${TARGET}" == "production" ]]; then
            base_url="${PROD_API_BASE_URL}"
          else
            base_url="${STAGING_API_BASE_URL}"
          fi
          base_url="${base_url%/}"

          BASE_URL="${base_url}" python - <<'PY'
          import json
          import os
          import re

          with open("postman-routes.json", encoding="utf-8") as source:
              routes = json.load(source)
          with open("postman-collection.json", encoding="utf-8") as source:
              collection = json.load(source)

          base_url = os.environ["BASE_URL"]
          variables = collection.setdefault("variable", [])

          def set_variable(key, value):
              for variable in variables:
                  if variable.get("key") == key:
                      variable["value"] = value
                      return
              variables.append({"key": key, "value": value, "type": "string"})

          set_variable("base_url", base_url)
          if not any(variable.get("key") == "xsrf_token" for variable in variables):
              set_variable("xsrf_token", "")

          items = collection.setdefault("item", [])
          folder = next(
              (item for item in items if item.get("name") == "Laravel Route Sync"),
              None,
          )
          if folder is None:
              folder = {
                  "name": "Laravel Route Sync",
                  "description": (
                      "Additive route inventory generated from Laravel. Group "
                      "prefixes are resolved by artisan; removals and curated "
                      "request changes remain manual."
                  ),
                  "item": [],
              }

          folder_items = folder.setdefault("item", [])
          existing = {
              (
                  item.get("request", {}).get("method"),
                  item.get("request", {}).get("url", {}).get("raw"),
              )
              for item in folder_items
          }

          added = 0
          for route in routes:
              path = "/" + re.sub(r"\{([^}]+)\}", r":\1", route["path"])
              raw_url = "{{base_url}}" + path
              identity = (route["method"], raw_url)
              if identity in existing:
                  continue

              headers = [
                  {"key": "Accept", "value": "application/json", "type": "text"}
              ]
              if route["method"] != "GET":
                  headers.extend(
                      [
                          {
                              "key": "Content-Type",
                              "value": "application/json",
                              "type": "text",
                          },
                          {
                              "key": "X-XSRF-TOKEN",
                              "value": "{{xsrf_token}}",
                              "type": "text",
                          },
                      ]
                  )

              request = {
                  "method": route["method"],
                  "header": headers,
                  "url": {
                      "raw": raw_url,
                      "host": ["{{base_url}}"],
                      "path": path.lstrip("/").split("/"),
                  },
                  "description": (
                      "Generated from Laravel route:list. This API uses a "
                      "Laravel session and resource permissions; authenticate "
                      "and set xsrf_token before mutating requests."
                  ),
              }
              if route["method"] not in {"GET", "DELETE"}:
                  request["body"] = {
                      "mode": "raw",
                      "raw": "{}",
                      "options": {"raw": {"language": "json"}},
                  }

              folder_items.append(
                  {
                      "name": route["name"] or f'{route["method"]} {path}',
                      "request": request,
                      "response": [],
                  }
              )
              existing.add(identity)
              added += 1

          collection["item"] = [
              item for item in items if item.get("name") != "Laravel Route Sync"
          ] + [folder]

          with open("postman-updated.json", "w", encoding="utf-8") as target:
              json.dump(collection, target, indent=2)
          with open("postman-update-request.json", "w", encoding="utf-8") as target:
              json.dump({"collection": collection}, target)

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"added={added}\n")
          print(f"Added {added} missing route(s) to the generated folder.")
          PY

      - name: Update Postman collection
        shell: bash
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
          POSTMAN_COLLECTION_ID: ${{ secrets.POSTMAN_COLLECTION_ID }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 3 \
            --request PUT \
            --header "X-Api-Key: ${POSTMAN_API_KEY}" \
            --header "Content-Type: application/json" \
            --data-binary @postman-update-request.json \
            "https://api.getpostman.com/collections/${POSTMAN_COLLECTION_ID}" \
            > postman-update-response.json

          python - <<'PY'
          import json

          with open("postman-update-response.json", encoding="utf-8") as source:
              response = json.load(source)
          if not response.get("collection", {}).get("uid"):
              raise SystemExit("Postman did not confirm the collection update.")
          PY

      - name: Write workflow summary
        shell: bash
        env:
          TARGET: ${{ steps.target.outputs.target }}
          ADDED: ${{ steps.merge.outputs.added }}
        run: |
          {
            echo "## Postman route synchronization"
            echo
            echo "- Target base URL: \`${TARGET}\`"
            echo "- Routes added: \`${ADDED}\`"
            echo "- Source: \`php artisan route:list --json\`"
            echo
            echo "The sync is additive. Review authentication, example bodies, deleted routes, and business-specific tests manually."
          } >> "${GITHUB_STEP_SUMMARY}"
